name: Build Wheels

on:
  # Every commit on every branch. A branches filter with no tags filter
  # excludes tag pushes, so the publish job stays off.
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is retired; macos-15-intel builds the x86_64 wheels.
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Linux and macOS builds vendor the Csound 7 release binaries during
      # the CMake configure step (scripts/vendor_csound7.sh). Package managers
      # (apt, Homebrew, choco) still ship Csound 6, which this wrapper does not
      # target. cibuildwheel settings live in pyproject.toml.
      - name: Install Csound 7 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP csound.zip
          $dir = Join-Path $env:RUNNER_TEMP csound
          Invoke-WebRequest https://github.com/csound/csound/releases/download/7.0.0/csound-windows-7.0.0.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter *.exe | Select-Object -First 1
          # Inno Setup installer; pin the path CMakeLists.txt expects.
          Start-Process $exe.FullName -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR="C:\Program Files\Csound7_x64"'
          Get-ChildItem 'C:\Program Files\Csound7_x64' -Recurse -Include csound64.*,csound.h | Select-Object FullName

      - name: Build wheels
        # 4.3.1+ ships the final CPython 3.15.0.
        uses: pypa/cibuildwheel@v4.3.4

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # One download with every wheel and the sdist. Runs when some builds fail,
  # so the successful ones are still downloadable.
  collect:
    name: Collect distributions
    needs: [build_wheels, build_sdist]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: cycsound-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/cycsound
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
