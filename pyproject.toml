[project]
name = "cycsound"
version = "0.2.0"
description = "Cython bindings for the Csound 7 audio synthesis library"
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
keywords = [
    "audio",
    "csound",
    "cython",
    "music",
    "synthesis",
    "dsp",
    "sound",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/shakfu/cycsound"
Repository = "https://github.com/shakfu/cycsound"
Issues = "https://github.com/shakfu/cycsound/issues"
Changelog = "https://github.com/shakfu/cycsound/blob/main/CHANGELOG.md"

[tool.scikit-build]
wheel.packages = ["src/cycsound"]
wheel.exclude = [
    "*.pxd",
    "*.pyx",
    "*.c",
    "*.h",
]
cmake.build-type = "Release"
sdist.exclude = [
    "build",
    "dist",
    ".venv",
    "*.egg-info",
]

# For static builds, use: pip install . --config-settings=cmake.define.STATIC=ON

[dependency-groups]
dev = [
    "pytest>=8.0",
    "twine>=6.2.0",
]

[project.scripts]
cycsound = "cycsound.__main__:main"

[build-system]
requires = ["scikit-build-core", "cython"]
build-backend = "scikit_build_core.build"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_*"
test-command = "python -c \"import cycsound; print(cycsound.get_version())\""
build-frontend = "build"

[tool.cibuildwheel.linux]
# The vendored libcsound64.so needs GLIBC_2.29, above the manylinux_2_28 limit.
manylinux-x86_64-image = "manylinux_2_34"
# The Csound 7 release binaries are vendored by the build itself
# (scripts/vendor_csound7.sh, run from CMake); only its tooling is needed here.
before-all = [
    "yum install -y unzip || (apt-get update && apt-get install -y unzip)",
]

[tool.cibuildwheel.macos]
# The upstream CsoundLib64 framework has a minimum target of macOS 12.0.
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }

[tool.cibuildwheel.windows]
# Csound 7 is installed by the workflow; bundle csound64.dll into the wheel.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path \"C:/Program Files/Csound7_x64/bin\" -w {dest_dir} {wheel}"
